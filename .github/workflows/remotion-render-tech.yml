name: Render Tech Demo (Remotion)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition name
        required: true
        default: TechDemo
        type: string
      output_name:
        description: Output file name
        required: true
        default: arc-s3-tech-demo.mp4
        type: string
      concurrency:
        description: Remotion concurrency (1-8)
        required: true
        default: "4"
        type: string
      generate_vo:
        description: Generate VO via ElevenLabs secrets
        required: true
        default: true
        type: boolean
      terminal_capture_url:
        description: Optional URL to terminal capture MP4
        required: false
        type: string
      ui_capture_url:
        description: Optional URL to UI walkthrough capture MP4
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        working-directory: video
        run: npm ci

      - name: Ensure ffmpeg is available
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi

          export DEBIAN_FRONTEND=noninteractive
          timeout 300 sudo apt-get update -o Acquire::Retries=3
          timeout 300 sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Validate capture inputs
        run: |
          set -euo pipefail
          TERM_URL="${{ inputs.terminal_capture_url }}"
          UI_URL="${{ inputs.ui_capture_url }}"
          if [[ -n "$TERM_URL" && -z "$UI_URL" ]]; then
            echo "terminal_capture_url provided without ui_capture_url"
            exit 1
          fi
          if [[ -z "$TERM_URL" && -n "$UI_URL" ]]; then
            echo "ui_capture_url provided without terminal_capture_url"
            exit 1
          fi

      - name: Download capture MP4s (optional)
        if: ${{ inputs.terminal_capture_url != '' && inputs.ui_capture_url != '' }}
        working-directory: video
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p public/captures
          AUTH_ARGS=()
          if [[ -n "${BLOB_READ_WRITE_TOKEN:-}" ]]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}")
          fi
          curl -L --fail "${AUTH_ARGS[@]}" "${{ inputs.terminal_capture_url }}" -o public/captures/arc-s3-terminal-output.hd.mp4
          curl -L --fail "${AUTH_ARGS[@]}" "${{ inputs.ui_capture_url }}" -o public/captures/arc-s3-ui-walkthrough.hd.mp4

      - name: Extract frame sequences
        if: ${{ inputs.terminal_capture_url != '' && inputs.ui_capture_url != '' }}
        working-directory: video
        run: |
          set -euo pipefail
          mkdir -p public/captures/terminal-frames public/captures/ui-frames
          ffmpeg -y -i public/captures/arc-s3-terminal-output.hd.mp4 -vf fps=30 public/captures/terminal-frames/%05d.png
          ffmpeg -y -i public/captures/arc-s3-ui-walkthrough.hd.mp4 -vf fps=30 public/captures/ui-frames/%05d.png

      - name: Assert frame assets exist
        working-directory: video
        run: |
          set -euo pipefail
          test -f public/captures/terminal-frames/00001.png || (echo "Missing terminal frames. Commit frames or provide capture URLs." && exit 1)
          test -f public/captures/ui-frames/00001.png || (echo "Missing UI frames. Commit frames or provide capture URLs." && exit 1)

      - name: Generate VO (optional)
        if: ${{ inputs.generate_vo }}
        working-directory: video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ELEVENLABS_API_KEY:-}" || -z "${ELEVENLABS_VOICE_ID:-}" ]]; then
            echo "Missing ELEVENLABS_API_KEY or ELEVENLABS_VOICE_ID repository secrets"
            exit 1
          fi
          npm run vo:tech

      - name: Assert VO assets exist
        working-directory: video
        run: |
          set -euo pipefail
          for clip in \
            tech-1-paradigm \
            tech-2-usecase \
            tech-3-zero-member-llc \
            tech-4-firewall \
            tech-5-escrow \
            tech-6-reputation \
            tech-7-demo-clean \
            tech-8-ui-walkthrough \
            tech-9-outro
          do
            test -f "public/vo/${clip}.mp3" || (echo "Missing public/vo/${clip}.mp3" && exit 1)
          done

      - name: Render composition
        working-directory: video
        run: |
          mkdir -p out
          npx remotion render "${{ inputs.composition }}" "out/${{ inputs.output_name }}" --concurrency="${{ inputs.concurrency }}"

      - name: Backup rendered video to Vercel Blob
        if: ${{ success() }}
        run: |
          set -euo pipefail
          if [[ -z "${BLOB_READ_WRITE_TOKEN:-}" ]]; then
            echo "BLOB_READ_WRITE_TOKEN is not configured; skipping Blob backup"
            exit 0
          fi
          npm --prefix video install --no-save @vercel/blob@2.4.0
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          async function main() {
            const { put } = await import('@vercel/blob');
            const fileName = process.env.OUTPUT_NAME;
            const runId = process.env.GITHUB_RUN_ID;
            const src = path.join(process.cwd(), 'video', 'out', fileName);
            const body = fs.readFileSync(src);
            const blobPath = `arc-s3/renders/${runId}-${fileName}`;
            const res = await put(blobPath, body, {
              access: 'private',
              addRandomSuffix: false,
              contentType: 'video/mp4',
            });
            console.log(`Backup blob path: ${res.pathname}`);
            console.log(`Backup blob url: ${res.url}`);
            console.log(`Backup blob downloadUrl: ${res.downloadUrl}`);
          }

          main().catch((err) => {
            console.error(err?.message || err);
            process.exit(1);
          });
          NODE
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ inputs.composition }}
          path: video/out/${{ inputs.output_name }}
          if-no-files-found: error
